name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catchup
          POSTGRES_PASSWORD: catchup
          POSTGRES_DB: catchup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catchup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://catchup:catchup@localhost:5432/catchup_test
      # Dummy values: Telegram is faked in every test.
      TELEGRAM_BOT_TOKEN: "123456:ci-test-token"
      BOT_MODE: polling
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Check the schema matches the migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
